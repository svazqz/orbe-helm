name: Verify
on: [push, pull_request, workflow_call, workflow_dispatch]

jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independent business rules and application workflows
        run: python3 -I -S tests/run_kernel.py
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependency pins
        run: python3 -m pip install --require-hashes -r requirements-dev.lock -r requirements-memory.lock
      - name: Check optional memory runtime without model downloads
        run: python3 scripts/check_memory_runtime.py
      - name: Full regressions, architecture, migrations, and provider contracts
        run: python3 scripts/dev.py check
      - name: Build distribution and verify independent installed imports
        run: |
          python3 -m pip wheel --no-deps --wheel-dir state/verification/wheels .
          python3 tests/check_wheel.py state/verification/wheels/orbehelm-*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: |
            state/verification/development/
            state/verification/wheels/
          if-no-files-found: warn
