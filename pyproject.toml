[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orbehelm"
version = "0.1.0a4"
description = "Compose reusable agent profiles and manage persistent orbes"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
memory = ["fastembed==0.9.1"]
web = ["fastapi>=0.115,<1", "Jinja2>=3.1.6,<4", "uvicorn>=0.34,<1"]
dev = ["httpx>=0.28,<1", "fastapi>=0.115,<1", "Jinja2>=3.1.6,<4", "uvicorn>=0.34,<1"]

[tool.setuptools.package-data]
"orbehelm.product" = ["templates/*.html", "static/*.css", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[project.scripts]
oh = "orbehelm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
cache-dir = "state/tool-cache/ruff"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
files = ["src/orbehelm/application/commands.py", "src/orbehelm/application/results.py", "src/orbehelm/application/ports/agents.py"]
follow_imports = "skip"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
cache_dir = "state/tool-cache/mypy"

[tool.coverage.run]
source = ["orbehelm.domain", "orbehelm.application"]
branch = true
data_file = "state/verification/development/.coverage"

[tool.coverage.report]
fail_under = 85
show_missing = true
